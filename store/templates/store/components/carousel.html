{% load static %}
<div id="carouselExampleCaptions" class="carousel slide carousel-fade mb-2" data-bs-ride="carousel">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
      aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="{% static 'images/carousel/carousel-08.jpg' %}" class="d-block w-100" alt="...">
      <div class="costom-carousel-caption">
        <h5 class="carousel-text-1">WELCOME</h5>
      </div>
    </div>
    <div class="carousel-item">
      <img src="{% static 'images/carousel/carousel-09.jpg' %}" class="d-block w-100" alt="...">
      <div class="costom-carousel-caption">
        <h5 class="carousel-text-2">Find our best offers</h5>
      </div>
    </div>
    <div class="carousel-item">
      <img src="{% static 'images/carousel/carousel-10.jpg' %}" class="d-block w-100" alt="...">
      <div class="costom-carousel-caption">
        <h5 class="carousel-text-3">That suit you</h5>
      </div>
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
    <!-- <span class="carousel-control-prev-icon" aria-hidden="true"></span> -->
    <i class="fas fa-angle-left c-prev"></i>
    <span class="visually-hidden control-style">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
    <!-- <span class="carousel-control-next-icon" aria-hidden="true"></span> -->
    <i class="fas fa-angle-right c-next"></i>
    <span class="visually-hidden control-style">Next</span>
  </button>
</div>
